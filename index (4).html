<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0c">
<title>Villi kopparin päiväkirja</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080a0c;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.app{max-width:520px;min-height:100vh;margin:auto;background:#080a0c;overflow:hidden}
.hero{min-height:540px;padding:24px 20px;position:relative;background:
linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.48) 45%,#080a0c 100%),
radial-gradient(circle at 72% 42%,rgba(255,130,30,.38),transparent 24%),
linear-gradient(145deg,#45535a 0%,#172126 48%,#080a0c 100%)}
.top{display:flex;justify-content:space-between}
.icon{width:44px;height:44px;border:1px solid #ffffff35;border-radius:14px;background:#0008;display:grid;place-items:center;font-size:22px}
h1{font-size:42px;line-height:1.02;letter-spacing:-1.5px;margin:125px 0 12px}
.sub{font-size:17px;color:#eee}
.orange-line{width:76px;height:4px;background:#ff6500;border-radius:99px;margin-top:18px}
main{margin-top:-92px;position:relative;padding:0 16px 105px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card,.entry,.modal-box{background:rgba(13,16,18,.94);border:1px solid #ffffff22;border-radius:18px}
.card{padding:15px}
.card small{color:#aeb4ba}
.card b{display:block;font-size:23px;margin-top:4px}
.title{display:flex;justify-content:space-between;align-items:center;margin:27px 3px 11px}
.title h2{font-size:21px;margin:0}
.orange{color:#ff6500;font-weight:700}
.entries{display:grid;gap:10px}
.entry{padding:14px;display:grid;grid-template-columns:47px 1fr auto;gap:11px}
.entry-icon{width:47px;height:47px;border:1px solid #ff650066;border-radius:12px;display:grid;place-items:center;font-size:21px}
.entry h3{font-size:17px;margin:0 0 4px}
.entry p{margin:0;color:#aeb4ba;font-size:13px;line-height:1.45}
.tag{font-size:11px;color:#ff7a1a;border:1px solid #ff650077;border-radius:7px;padding:5px 7px;height:max-content}
.empty{padding:25px;text-align:center;color:#aeb4ba;border:1px dashed #ffffff30;border-radius:18px}
.fab{position:fixed;right:max(22px,calc((100vw - 520px)/2 + 22px));bottom:84px;width:62px;height:62px;border:0;border-radius:50%;background:#ff6500;color:#fff;font-size:38px;line-height:1;box-shadow:0 8px 25px #ff650055;z-index:5}
nav{position:fixed;left:12px;right:12px;bottom:10px;max-width:496px;margin:auto;height:70px;background:#0c0f11f5;border:1px solid #ffffff22;border-radius:23px;display:grid;grid-template-columns:repeat(4,1fr);z-index:4}
nav button{border:0;background:none;color:#aeb4ba;font:inherit;font-size:11px}
nav button span{display:block;font-size:22px;margin-bottom:2px}
nav .active{color:#ff6500}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end}
.modal-box{width:100%;max-width:520px;margin:auto;padding:20px;border-radius:24px 24px 0 0;background:#101315}
.modal-box h2{margin-top:0}
label{display:block;color:#cbd0d5;font-size:13px;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #ffffff22;background:#080a0c;color:#fff;font:inherit}
textarea{min-height:75px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:15px}
.btn{flex:1;padding:12px;border:0;border-radius:11px;font-weight:700;background:#22272b;color:#fff}
.primary{background:#ff6500}
@media(max-width:380px){h1{font-size:36px}.hero{min-height:515px}}
</style>
</head>
<body>
<div class="app">
<section class="hero">
  <div class="top"><div class="icon">☰</div><div class="icon">🔔</div></div>
  <h1>Villi kopparin<br>päiväkirja</h1>
  <div class="sub">Kirjaa huollot, ajot ja tankkaukset helposti.</div>
  <div class="orange-line"></div>
</section>

<main>
<section class="stats">
  <div class="card"><small>Huollot</small><b id="huollot">0</b></div>
  <div class="card"><small>Ajot</small><b id="ajot">0</b></div>
  <div class="card"><small>Polttoaine</small><b id="fuel">0,0 l</b></div>
  <div class="card"><small>Merkinnät</small><b id="all">0</b></div>
</section>

<div class="title"><h2>Viimeisimmät merkinnät</h2><span class="orange">Näytä kaikki ›</span></div>
<section id="entries" class="entries"></section>
</main>

<button class="fab" id="open">+</button>

<nav>
<button class="active"><span>⌂</span>Päiväkirja</button>
<button><span>▥</span>Tilastot</button>
<button><span>◔</span>Yhteenveto</button>
<button><span>⚙</span>Asetukset</button>
</nav>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<h2>Lisää merkintä</h2>
<label>Tyyppi</label>
<select id="type">
<option>Ajo</option><option>Huolto</option><option>Polttoaine</option><option>Muistiinpano</option>
</select>
<div class="row">
<div><label>Päivä</label><input id="date" type="date"></div>
<div><label>Kilometrit</label><input id="km" type="number" min="0" step="0.1"></div>
</div>
<div class="row">
<div><label>Litrat</label><input id="liters" type="number" min="0" step="0.1"></div>
<div><label>€/l</label><input id="price" type="number" min="0" step="0.001"></div>
</div>
<label>Selite</label>
<textarea id="note" placeholder="Esim. Kesälenkki järven ympäri"></textarea>
<div class="actions">
<button class="btn" id="cancel">Peruuta</button>
<button class="btn primary" id="save">Tallenna</button>
</div>
</div>
</div>

<script>
const KEY="villi-koppari-final";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
 $("huollot").textContent=data.filter(x=>x.type==="Huolto").length;
 $("ajot").textContent=data.filter(x=>x.type==="Ajo").length;
 $("fuel").textContent=data.reduce((sum,x)=>sum+(Number(x.liters)||0),0).toFixed(1).replace(".",",")+" l";
 $("all").textContent=data.length;
 const box=$("entries"); box.innerHTML="";
 if(!data.length){
  box.innerHTML='<div class="empty">Ei vielä merkintöjä.<br>Paina oranssia + -painiketta lisätäksesi ensimmäisen.</div>';
  return;
 }
 [...data].reverse().slice(0,10).forEach(x=>{
  const icons={Ajo:"🛣️",Huolto:"🔧",Polttoaine:"⛽",Muistiinpano:"📝"};
  const el=document.createElement("article");
  el.className="entry";
  el.innerHTML='<div class="entry-icon">'+(icons[x.type]||"📝")+'</div>'+
   '<div><h3>'+esc(x.note||x.type)+'</h3><p>'+esc(x.date)+
   (x.km?" · "+esc(x.km)+" km":"")+
   (x.liters?" · "+esc(x.liters)+" l":"")+
   (x.price?" · "+esc(x.price)+" €/l":"")+
   '</p></div><span class="tag">'+esc(x.type)+'</span>';
  box.appendChild(el);
 });
}
$("open").onclick=()=>{$("modal").style.display="flex"};
$("cancel").onclick=()=>{$("modal").style.display="none"};
$("save").onclick=()=>{
 const item={
  type:$("type").value,date:$("date").value,km:$("km").value,
  liters:$("liters").value,price:$("price").value,note:$("note").value
 };
 if(!item.date){alert("Valitse päivä.");return}
 data.push(item);
 localStorage.setItem(KEY,JSON.stringify(data));
 render();
 $("modal").style.display="none";
 $("km").value="";$("liters").value="";$("price").value="";$("note").value="";
};
render();
</script>
</body>
</html>
