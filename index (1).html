<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<title>Villi kopparin päiväkirja</title>
<style>
:root{
  --bg:#080a0c; --card:rgba(12,15,17,.88); --line:rgba(255,255,255,.14);
  --text:#fff; --muted:#b7bcc2; --orange:#ff6500; --orange2:#ff8a00;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
.app{min-height:100vh;position:relative;padding-bottom:100px}
.hero{
  min-height:520px;padding:42px 22px 145px;position:relative;overflow:hidden;
  background:
    linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.62) 58%,#080a0c 100%),
    radial-gradient(circle at 75% 42%,rgba(255,130,30,.25),transparent 32%),
    linear-gradient(145deg,#26313a 0%,#11171b 48%,#080a0c 100%);
}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(0,0,0,.35),transparent 55%,rgba(0,0,0,.25));pointer-events:none}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center}
.icon{width:44px;height:44px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:23px}
.brand{position:relative;z-index:2;margin-top:58px;max-width:330px}
.brand h1{font-size:42px;line-height:1.02;margin:0 0 16px;font-weight:800;letter-spacing:-1.5px}
.brand p{font-size:18px;color:#eee;margin:0}
.orange-line{width:78px;height:4px;background:var(--orange);border-radius:99px;margin-top:22px}
.content{position:relative;z-index:3;margin-top:-92px;padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat small{color:var(--muted);display:block;font-size:12px}.stat strong{font-size:25px;display:block;margin-top:4px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 4px 12px}
.section-title h2{font-size:23px;margin:0}.link{color:var(--orange);font-weight:700}
.entries{display:grid;gap:10px}
.entry{background:rgba(12,15,17,.94);border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:start}
.entry-icon{width:48px;height:48px;border-radius:13px;border:1px solid rgba(255,101,0,.45);display:grid;place-items:center;font-size:22px;color:var(--orange)}
.entry h3{margin:0 0 5px;font-size:17px}.entry p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.tag{font-size:12px;border:1px solid rgba(255,101,0,.55);color:var(--orange);padding:5px 8px;border-radius:8px}
.empty{color:var(--muted);text-align:center;padding:28px;border:1px dashed var(--line);border-radius:18px}
.fab{position:fixed;right:22px;bottom:82px;width:62px;height:62px;border:0;border-radius:50%;background:linear-gradient(145deg,var(--orange2),#f34b00);color:white;font-size:39px;line-height:1;box-shadow:0 10px 30px rgba(255,101,0,.35);z-index:10}
.nav{position:fixed;left:12px;right:12px;bottom:10px;height:68px;background:rgba(12,15,17,.95);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);z-index:9;backdrop-filter:blur(12px)}
.nav button{background:none;border:0;color:#aeb3b9;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button span{font-size:22px}.nav button.active{color:var(--orange)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:20}.sheet{width:100%;background:#101316;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}
label{display:block;color:#c6cbd0;font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#080a0c;color:#fff;font:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#191d21;color:#fff;font-weight:700}.primary{background:var(--orange);border-color:var(--orange)}
@media(min-width:700px){.app{max-width:520px;margin:auto;box-shadow:0 0 60px #000}.hero{min-height:570px}.brand h1{font-size:44px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="top"><div class="icon">☰</div><div class="icon">🔔</div></div>
    <div class="brand">
      <h1>Villi kopparin<br>päiväkirja</h1>
      <p>Kirjaa huollot, ajot ja tankkaukset helposti.</p>
      <div class="orange-line"></div>
    </div>
  </section>

  <main class="content">
    <section class="stats">
      <div class="stat"><small>Huollot</small><strong id="sHuolto">0</strong></div>
      <div class="stat"><small>Ajot</small><strong id="sAjo">0</strong></div>
      <div class="stat"><small>Polttoaine</small><strong id="sFuel">0,0 l</strong></div>
      <div class="stat"><small>Merkinnät</small><strong id="sAll">0</strong></div>
    </section>

    <div class="section-title"><h2>Viimeisimmät merkinnät</h2><span class="link">Kaikki</span></div>
    <section id="entries" class="entries"></section>
  </main>

  <button class="fab" id="add">+</button>
  <nav class="nav">
    <button class="active"><span>⌂</span>Päiväkirja</button>
    <button><span>▥</span>Tilastot</button>
    <button><span>◔</span>Yhteenveto</button>
    <button><span>⚙</span>Asetukset</button>
  </nav>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>Lisää merkintä</h2>
    <label>Tyyppi</label>
    <select id="type"><option value="Ajo">Ajo</option><option value="Huolto">Huolto</option><option value="Polttoaine">Polttoaine</option><option value="Muistiinpano">Muistiinpano</option></select>
    <div class="row">
      <div><label>Päivä</label><input id="date" type="date"></div>
      <div><label>Kilometrit</label><input id="km" type="number" min="0" step="0.1" placeholder="esim. 85"></div>
    </div>
    <div class="row">
      <div><label>Litrat</label><input id="liters" type="number" min="0" step="0.1" placeholder="esim. 20"></div>
      <div><label>€/l</label><input id="price" type="number" min="0" step="0.001" placeholder="1.999"></div>
    </div>
    <label>Selite</label><textarea id="note" placeholder="Mitä tapahtui?"></textarea>
    <div class="actions"><button class="btn" id="cancel">Peruuta</button><button class="btn primary" id="save">Tallenna</button></div>
  </div>
</div>

<script>
const KEY="villiKoppariEntries";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function saveData(){localStorage.setItem(KEY,JSON.stringify(entries));render();}
function render(){
  $("sHuolto").textContent=entries.filter(x=>x.type==="Huolto").length;
  $("sAjo").textContent=entries.filter(x=>x.type==="Ajo").length;
  $("sFuel").textContent=entries.reduce((a,x)=>a+(Number(x.liters)||0),0).toFixed(1).replace(".",",")+" l";
  $("sAll").textContent=entries.length;
  const box=$("entries"); box.innerHTML="";
  if(!entries.length){box.innerHTML='<div class="empty">Ei vielä merkintöjä.<br>Paina oranssia + -painiketta lisätäksesi ensimmäisen.</div>';return;}
  [...entries].reverse().slice(0,8).forEach((x,i)=>{
    const icons={Ajo:"🛣️",Huolto:"🔧",Polttoaine:"⛽",Muistiinpano:"📝"};
    const d=document.createElement("article");d.className="entry";
    d.innerHTML=`<div class="entry-icon">${icons[x.type]||"📝"}</div><div><h3>${escapeHtml(x.note||x.type)}</h3><p>${x.date||""}${x.km?` · ${x.km} km`:""}${x.liters?` · ${x.liters} l`:""}${x.price?` · ${x.price} €/l`:""}</p></div><span class="tag">${x.type}</span>`;
    box.appendChild(d);
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
$("add").onclick=()=>$("modal").style.display="flex";
$("cancel").onclick=()=>$("modal").style.display="none";
$("save").onclick=()=>{
  entries.push({type:$("type").value,date:$("date").value,km:$("km").value,liters:$("liters").value,price:$("price").value,note:$("note").value});
  saveData();
  $("modal").style.display="none";
  $("km").value=$("liters").value=$("price").value=$("note").value="";
};
render();
</script>
</body>
</html>
